pid /tmp/subsieve-token-limit-runtime/nginx.pid;
error_log /tmp/subsieve-token-limit-runtime/error.log notice;

events {}

http {
    access_log off;

    map $remote_addr $whitelist_ip {
        default 0;
    }

    map "$whitelist_ip:$arg_token" $token_pull_rate_key {
        default "";
        "~^0:.+$" $arg_token;
    }
    limit_req_zone $token_pull_rate_key zone=token_pull_limit:1m rate=10r/m;

    server {
        listen 127.0.0.1:18082;
        location / { return 204; }
    }

    server {
        listen 127.0.0.1:18081;
        location /subscribe {
            include /tmp/subsieve-token-limit-runtime/token_limit_apply.conf;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:18082;
        }
    }
}
