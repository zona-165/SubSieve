pid /tmp/subsieve-idc-runtime/nginx.pid;
error_log /tmp/subsieve-idc-runtime/error.log notice;

events {}

http {
    include /etc/nginx/subscribe/cloud_geo.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_user_agent $is_custom_bad_ua {
        default 0;
    }

    map $arg_token $is_token_blacklisted {
        default 0;
    }

    # Deliberately whitelist clash to verify that it cannot bypass IDC rules.
    map $http_user_agent $is_ua_whitelisted {
        default 0;
        "clash" 1;
    }

    geo $whitelist_ip {
        default 0;
    }

    include /etc/nginx/subscribe/token_limit_rate.conf;
    include /etc/nginx/subscribe/token_limit.conf;

    # Prevent a failed block assertion from reaching the real backend.
    resolver 127.0.0.1 valid=1s ipv6=off;
    resolver_timeout 100ms;

    server {
        listen 127.0.0.1:18080;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-SubSieve-Test-IP;
        include /etc/nginx/subscribe/protect.conf;
    }
}
